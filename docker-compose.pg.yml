version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: scan_benchmark_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bigid111!
      POSTGRES_DB: benchmark_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
